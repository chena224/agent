# cluster 档接入层:多 web 实例负载均衡 + SSE 流式透传
upstream rag_web {
    # compose 网络内 web 服务名解析到全部实例;Docker DNS 轮询
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 与应用 UPLOAD_MAX_MB 对齐,超写在边缘直接拒(不等应用读内存)
    client_max_body_size 50m;
    client_body_timeout 120s;

    # 问答(SSE 流式):关缓冲、延长读超时,避免截断长回答
    location /api/chat {
        proxy_pass http://rag_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;            # SSE 关键:逐条下发,不聚合
        proxy_cache off;
        proxy_read_timeout 600s;        # 检索+生成最坏时长
        chunked_transfer_encoding on;
    }

    # 其余 API
    location /api/ {
        proxy_pass http://rag_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # 前端静态资源(由 FastAPI 托管 dist)
    location / {
        proxy_pass http://rag_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
